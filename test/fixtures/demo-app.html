<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo app</title>
<style>
  body { margin: 0; font: 16px system-ui; background: #fff; }
  #btn { position: absolute; left: 20px; top: 20px; width: 150px; height: 60px; }
  form { position: absolute; top: 120px; left: 20px; right: 20px; }
  input { display: block; width: 100%; height: 44px; margin: 0 0 14px; box-sizing: border-box; font: 18px system-ui; }
  #list { position: absolute; top: 400px; left: 0; right: 0; height: 300px; overflow: auto; background: #eef; }
  #list div { height: 80px; border-bottom: 1px solid #99a; }
</style>
<button id="btn" onclick="document.title = 'clicked ' + (++window.n)">Tik</button>
<form>
  <input id="e" type="email" placeholder="Je e-mailadres">
  <input id="f" name="voornaam" placeholder="Voornaam">
  <input id="p" type="password" placeholder="Wachtwoord">
</form>
<div id="list"></div>
<script>
  window.n = 0;
  document.getElementById('list').innerHTML = Array.from({ length: 30 }, (_, i) => '<div>Rij ' + i + '</div>').join('');
  window.log = [];
  for (const t of ['focusin', 'focusout', 'input']) addEventListener(t, e => log.push(t + ':' + (e.target.id || e.target.tagName) + ':' + (e.target.value || '')), true);
</script>

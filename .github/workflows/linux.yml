name: Linux build

# Builds the x64 Linux apps, checks that they start, and adds them to existing releases together with their line in
# SHA256SUMS.txt. Built on Linux so the zip keeps the executable bits and symlinks.
on:
  workflow_dispatch:
    inputs:
      studio_tag:
        description: Motion Studio release to add the Linux build to (e.g. v1.3.0), empty to skip
        required: false
      launcher_tag:
        description: Motion Launcher release to add the Linux build to (e.g. launcher-v1.2.0), empty to skip
        required: false

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Motion Studio
        if: inputs.studio_tag != ''
        run: |
          npm run pack:linux
          dir="dist/Motion Studio-linux-x64"
          home=$(mktemp -d)
          HOME="$home" node scripts/smoke-project.mjs "$home/project"
          HOME="$home" xvfb-run -a "$dir/motion-studio" --no-sandbox --smoke-test studio.png
          version=$(node -p "require('./package.json').version")
          test "v$version" = "${{ inputs.studio_tag }}" || { echo "package.json is $version, the tag is ${{ inputs.studio_tag }}"; exit 1; }
          zip="Motion-Studio-$version-linux-x64.zip"
          (cd "$dir" && zip -qry "$GITHUB_WORKSPACE/$zip" .)
          echo "STUDIO_ZIP=$zip" >> "$GITHUB_ENV"

      - name: Motion Launcher
        if: inputs.launcher_tag != ''
        run: |
          npm run pack:launcher:linux
          dir="dist/Motion Launcher-linux-x64"
          MOTION_LAUNCHER_HOME=$(mktemp -d) xvfb-run -a "$dir/motion-launcher" --no-sandbox --smoke-test launcher.png
          version=$(node -p "require('./launcher/package.json').version")
          test "launcher-v$version" = "${{ inputs.launcher_tag }}" || { echo "launcher is $version, the tag is ${{ inputs.launcher_tag }}"; exit 1; }
          zip="Motion-Launcher-$version-linux-x64.zip"
          (cd "$dir" && zip -qry "$GITHUB_WORKSPACE/$zip" .)
          echo "LAUNCHER_ZIP=$zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: '*.png'

      # Adds the zip and its checksum line (replacing an older line for the same file) to the release.
      - name: Publish
        run: |
          publish() {
            tag=$1; zip=$2; [ -n "$tag" ] && [ -n "$zip" ] || return 0
            rm -f SHA256SUMS.txt
            gh release download "$tag" -p SHA256SUMS.txt || touch SHA256SUMS.txt
            grep -v " \*\?$zip\$" SHA256SUMS.txt > sums.tmp || true
            sha256sum -b "$zip" >> sums.tmp
            mv sums.tmp SHA256SUMS.txt
            cat SHA256SUMS.txt
            gh release upload "$tag" "$zip" SHA256SUMS.txt --clobber
          }
          publish "${{ inputs.studio_tag }}" "$STUDIO_ZIP"
          publish "${{ inputs.launcher_tag }}" "$LAUNCHER_ZIP"
